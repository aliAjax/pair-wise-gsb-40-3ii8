<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>海上搜救协调</title>
<style>
  body{font:15px/1.6 system-ui,sans-serif;max-width:1180px;margin:30px auto;padding:0 20px;color:#17324d}
  table{border-collapse:collapse;width:100%;margin:16px 0}
  th,td{border:1px solid #cbd8e3;padding:8px;text-align:left;vertical-align:top}
  th{background:#edf5fb}
  code{background:#f2f5f7;padding:2px 5px}
  .card{background:#f7fbfe;border-left:5px solid #2784c7;padding:12px 16px;margin:12px 0}
  .tag{display:inline-block;border-radius:10px;padding:1px 10px;font-size:12px;color:#fff}
  .merged,.applied{background:#2e8b57}
  .conflict,.pending_review{background:#d08a1d}
  .rejected,.cancelled,.closed{background:#9aa7b1}
  .reported,.coordinating,.recovering,.assigned{background:#2784c7}
  .batch{border:1px solid #cbd8e3;border-radius:8px;margin:14px 0;overflow:hidden}
  .batch h3{margin:0;padding:10px 14px;background:#f2f7fb;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .batch table{margin:0;border:none}
  button{cursor:pointer;border:0;border-radius:5px;padding:5px 12px;margin:2px 4px 2px 0;font-size:13px}
  .btn-apply{background:#2e8b57;color:#fff}
  .btn-force{background:#c0392b;color:#fff}
  .btn-dismiss{background:#7f8c8d;color:#fff}
  .muted{color:#66788a;font-size:12px}
  .err{color:#b3261e}
</style>
<h1>海上搜救协调</h1>
<div class="card">网络恢复后，船端离线批次按<b>现场时间</b>逐条重放：成功项立即写入资源状态、搜索区域和时间线；与岸端冲突的操作保留原意，进入<b>待裁决</b>。同批次/同事件重试幂等，不会重复占用资源。</div>

<h2>遇险事件</h2>
<table id="incidents"><thead><tr><th>编号</th><th>船名</th><th>状态</th><th>海况</th><th>负责机构</th><th>版本</th></tr></thead><tbody></tbody></table>

<h2>资源</h2>
<table id="assets"><thead><tr><th>名称</th><th>类型</th><th>状态</th><th>版本</th><th>航程</th></tr></thead><tbody></tbody></table>

<h2>搜索区域</h2>
<table id="areas"><thead><tr><th>编号</th><th>事件</th><th>状态</th><th>优先级</th><th>占用资源</th><th>版本</th></tr></thead><tbody></tbody></table>

<h2>离线批次（已生效 / 待裁决 / 已拒绝）</h2>
<div id="batches"><p class="muted">加载中…</p></div>

<h2>时间线（按现场时间归位）</h2>
<ol id="timeline"></ol>

<script>
const TYPE_LABEL = {
  'clue':'线索上报','timeline':'现场备注','asset.assign':'资源占用',
  'area.withdraw':'区域撤回','asset.withdraw':'资源撤回','incident.transfer':'事件移交'
};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tag = s => `<span class="tag ${esc(s)}">${esc(s)}</span>`;

function fillTable(id, rows, cols){
  document.querySelector('#'+id+' tbody').innerHTML = rows.map(r =>
    '<tr>'+cols.map(c => `<td>${esc(r[c])}</td>`).join('')+'</tr>').join('');
}

function renderBatches(batches){
  const el = document.querySelector('#batches');
  if(!batches.length){ el.innerHTML = '<p class="muted">暂无离线批次。</p>'; return; }
  el.innerHTML = batches.map(b => {
    const c = b.counts;
    const rows = b.events.map(e => {
      const actions = e.status === 'conflict'
        ? `<button class="btn-apply" onclick="resolve('${esc(e.client_event_id)}','apply',false)">按现场生效</button>
           <button class="btn-force" onclick="resolve('${esc(e.client_event_id)}','apply',true)">强制生效(force)</button>
           <button class="btn-dismiss" onclick="resolve('${esc(e.client_event_id)}','dismiss',false)">驳回</button>`
        : (e.resolution ? `<span class="muted">裁决：${esc(e.resolution)}</span>` : '');
      const note = e.error ? `<div class="err">${esc(e.error)}</div>` : '';
      const code = e.conflict_code ? ` <code>${esc(e.conflict_code)}</code>` : '';
      const idem = e.idempotent ? ' <span class="muted">幂等命中</span>' : '';
      return `<tr>
        <td><code>${esc(e.client_event_id)}</code>${idem}</td>
        <td>${esc(TYPE_LABEL[e.type] || e.type)}</td>
        <td>${esc(e.occurred_at || '—')}</td>
        <td>${tag(e.status)}${code}${note}</td>
        <td>${actions}</td>
      </tr>`;
    }).join('');
    return `<div class="batch">
      <h3><code>${esc(b.batch_id)}</code> ${tag(b.status)}
        <span>✅ 已生效 ${c.accepted}</span>
        <span>⏳ 待裁决 ${c.conflicted}</span>
        <span>🚫 已拒绝 ${c.rejected}</span>
        <span class="muted">${esc(b.actor)} · 接收 ${esc(b.received_at)}</span>
      </h3>
      <table><thead><tr><th>事件ID</th><th>现场操作</th><th>现场时间</th><th>结果</th><th>裁决</th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>`;
  }).join('');
}

async function resolve(eventId, resolution, force){
  if(force && !confirm('强制生效将以现场处置为准覆盖岸端安排，确认继续？')) return;
  const r = await fetch('/api/offline/conflicts/resolve', {
    method:'POST',
    headers:{'Content-Type':'application/json','X-User':'web-coordinator','X-Role':'coordinator'},
    body: JSON.stringify({client_event_id:eventId, resolution, force, note:'页面裁决'})
  });
  const data = await r.json();
  if(!r.ok){ alert(data.error || '裁决失败'); return; }
  load();
}

async function load(){
  const d = await fetch('/api/state').then(r => r.json());
  fillTable('incidents', d.incidents, ['code','vessel_name','status','sea_state','lead_org','version']);
  fillTable('assets', d.assets, ['name','kind','status','version','range_km']);
  fillTable('areas', d.search_areas, ['code','incident_id','status','priority','assigned_asset_id','version']);
  renderBatches(d.offline_batches || []);
  document.querySelector('#timeline').innerHTML = d.timeline.slice(0, 30).map(x =>
    `<li>${esc(x.occurred_at || x.created_at)} <b>${esc(x.action)}</b> ${esc(x.details)}${x.occurred_at ? ' <span class="muted">(现场时间)</span>' : ''}</li>`
  ).join('');
}
load();
</script>
</html>
